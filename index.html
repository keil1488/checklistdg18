<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #0F0F0F; --accent-color: #4AD9FF; --timer-color: #FF9F4A; --danger-color: #FF4A4A; --text-main: #FFFFFF; --text-hint: #808080; --card-bg: rgba(255, 255, 255, 0.03); }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-main); padding: 20px; margin: 0; }
        .task-item, .add-placeholder { background: var(--card-bg); border: 1px solid rgba(74,217,255,0.1); border-radius: 15px; padding: 15px; margin-bottom: 10px; position: relative; }
        .task-row { display: flex; align-items: center; }
        .checkbox { width: 22px; height: 22px; border: 2px solid var(--accent-color); border-radius: 50%; margin-right: 12px; flex-shrink: 0; }
        .checkbox.checked { background: var(--accent-color); }
        .task-text { flex-grow: 1; font-size: 16px; }
        .timer-badge { font-size: 11px; color: var(--timer-color); margin-top: 8px; font-family: monospace; }
        .timer-expired { color: var(--danger-color); }
        .delete-btn { color: var(--danger-color); font-size: 18px; margin-left: 10px; cursor: pointer; }
        .add-active { display: none; flex-direction: column; }
        .time-inputs { display: flex; gap: 5px; margin-top: 10px; }
        input { background: rgba(255,255,255,0.1); border: 1px solid var(--accent-color); color: white; border-radius: 5px; padding: 5px; width: 40px; text-align: center; }
        .btn-ok { background: var(--accent-color); color: black; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; margin-top: 10px; }
        .completed { opacity: 0.4; }
    </style>
</head>
<body>

<div id="taskList"></div>

<div class="add-placeholder" id="addZone">
    <div id="addStatic" onclick="openAdd()">+ Вписать цель</div>
    <div id="addActive" class="add-active">
        <input type="text" id="taskText" placeholder="Что нужно сделать?" style="width: 100%; margin-bottom: 10px;">
        <div style="font-size: 12px; color: var(--accent-color);">Таймер (Д:Ч:М:С)</div>
        <div class="time-inputs">
            <input type="number" id="d" placeholder="0">
            <input type="number" id="h" placeholder="0">
            <input type="number" id="m" placeholder="0">
            <input type="number" id="s" placeholder="0">
        </div>
        <button class="btn-ok" onclick="addTask()">Добавить цель</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const USER_ID = tg.initDataUnsafe?.user?.id || 12345;
    const SECRET = "dg18secret";
    let tasks = JSON.parse(localStorage.getItem('tasks_v3') || '[]');

    function openAdd() {
        document.getElementById('addStatic').style.display = 'none';
        document.getElementById('addActive').style.display = 'flex';
        document.getElementById('taskText').focus();
    }

    async function sync() {
        localStorage.setItem('tasks_v3', JSON.stringify(tasks));
        try {
            await fetch('https://github.com/keil1488/DG18bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Secret': SECRET },
                body: JSON.stringify({ user_id: USER_ID, goals: tasks })
            });
        } catch(e) {}
    }

    function addTask() {
        const text = document.getElementById('taskText').value;
        if (!text) return;
        const ms = ( (parseInt(document.getElementById('d').value)||0)*86400 + (parseInt(document.getElementById('h').value)||0)*3600 + (parseInt(document.getElementById('m').value)||0)*60 + (parseInt(document.getElementById('s').value)||0) ) * 1000;
        const deadline = ms > 0 ? Date.now() + ms : null;

        tasks.push({ id: Date.now().toString(), text, done: false, deadline, createdAt: Date.now() });
        document.getElementById('taskText').value = '';
        document.getElementById('addStatic').style.display = 'block';
        document.getElementById('addActive').style.display = 'none';
        render();
        sync();
    }

    async function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        render();
        await fetch('https://github.com/keil1488/DG18bot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Secret': SECRET },
            body: JSON.stringify({ goal_id: id })
        });
    }

    function toggle(id) {
        const t = tasks.find(x => x.id === id);
        if (t) { t.done = !t.done; render(); sync(); }
    }

    function render() {
        const container = document.getElementById('taskList');
        container.innerHTML = '';
        tasks.forEach(t => {
            const div = document.createElement('div');
            div.className = `task-item ${t.done ? 'completed' : ''}`;

            let timer = '';
            if (t.deadline && !t.done) {
                const diff = t.deadline - Date.now();
                if (diff < 0) timer = '<div class="timer-badge timer-expired">⌛ Время вышло</div>';
                else {
                    const parts = new Date(diff).toISOString().substr(11, 8);
                    timer = `<div class="timer-badge">⏱ Осталось: ${Math.floor(diff/86400000)}д ${parts}</div>`;
                }
            }

            div.innerHTML = `
                <div class="task-row">
                    <div class="checkbox ${t.done ? 'checked' : ''}" onclick="toggle('${t.id}')"></div>
                    <div class="task-text">${t.text}</div>
                    <div class="delete-btn" onclick="deleteTask('${t.id}')">🗑</div>
                </div>
                ${timer}
            `;
            container.appendChild(div);
        });
    }

    setInterval(render, 1000);
    render();
</script>
</body>
</html>
