<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0F0F0F;
            --accent-color: #4AD9FF;
            --danger-color: #FF4A4A;
            --text-main: #FFFFFF;
            --text-hint: #808080;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover-bg: rgba(74, 217, 255, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .header-container { margin-bottom: 30px; text-align: center; }
        h2 {
            margin: 0; font-weight: 700; font-size: 18px;
            border-right: 2px solid var(--accent-color);
            display: inline-block; animation: caret 0.7s step-end infinite;
            line-height: 1.4; min-height: 1.4em;
        }
        #local-clock {
            margin-top: 10px; font-size: 32px; font-weight: 800;
            color: var(--accent-color); letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(74, 217, 255, 0.3);
        }

        @keyframes caret { from, to { border-color: transparent } 50% { border-color: var(--accent-color) } }

        .task-item, .add-placeholder {
            background: var(--card-bg); border: 1px solid rgba(74, 217, 255, 0.1);
            border-radius: 20px; padding: 18px; margin-bottom: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; cursor: pointer;
        }

        .task-item:hover, .add-placeholder:hover {
            transform: scale(1.01);
            background: var(--card-hover-bg);
            border-color: rgba(74, 217, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .task-item:active, .add-placeholder:active { transform: scale(0.98); opacity: 0.8; }

        .task-row { display: flex; align-items: center; width: 100%; }

        .deadline-badge {
            font-size: 12px; margin-top: 10px; color: var(--accent-color);
            font-family: ui-monospace, monospace; font-weight: 500;
        }
        .deadline-expired { color: var(--danger-color); font-weight: 700; }

        .plus-icon {
            width: 30px; height: 30px; border: 2px solid var(--accent-color);
            border-radius: 50%; margin-right: 15px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-color); flex-shrink: 0; font-size: 22px;
        }

        .right-action { position: absolute; right: 15px; top: 18px; display: flex; gap: 8px; }
        .action-btn { padding: 5px; opacity: 0.6; font-size: 18px; transition: 0.2s; }
        .action-btn:hover { opacity: 1; transform: scale(1.1); }

        .checkbox-container {
            width: 26px; height: 26px; border: 2px solid var(--accent-color);
            border-radius: 50%; margin-right: 15px; position: relative; flex-shrink: 0;
        }
        .checkbox-container.checked { background: var(--accent-color); }
        .checkbox-container.checked::after { content: '✓'; position: absolute; color: #000; left: 6px; top: 2px; font-weight: bold; }

        .task-text { font-size: 17px; flex-grow: 1; padding-right: 80px; line-height: 1.4; }
        .edit-input { background: transparent; border: none; color: white; font-size: 17px; width: 100%; outline: none; }

        .add-form-content { width: 100%; margin-top: 15px; display: none; flex-direction: column; }

        .time-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .time-unit { display: flex; flex-direction: column; align-items: center; }
        .time-unit label { font-size: 10px; color: var(--text-hint); margin-bottom: 5px; text-transform: uppercase; }
        .time-field {
            width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(74, 217, 255, 0.3);
            color: white; border-radius: 12px; text-align: center; padding: 12px 0; font-size: 16px; font-weight: bold;
        }

        .main-submit-btn {
            background: linear-gradient(135deg, var(--accent-color), #2BB5FF);
            color: #000; border: none; border-radius: 14px; padding: 16px;
            font-size: 16px; font-weight: 800; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* Увеличенная кнопка дедлайна */
        .toggle-deadline-link {
            color: var(--accent-color); font-size: 15px; font-weight: 600;
            margin: 12px 0; text-align: center; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }
        .toggle-deadline-link:active { opacity: 0.6; }

        .completed { opacity: 0.4; }
        .completed .task-text { text-decoration: line-through; }
    </style>
</head>
<body>

<div class="header-container">
    <h2 id="typewriter"></h2>
    <div id="local-clock">00:00:00</div>
</div>

<div class="task-list" id="taskList"></div>

<div class="add-placeholder" id="addZone">
    <div class="task-row" onclick="openAddMode()">
        <div class="plus-icon">+</div>
        <div id="addStatic" style="flex-grow:1;">
            <span style="color: var(--text-hint); font-size: 16px;">Вписать свою ЦЕЛЬ в историю</span>
        </div>
        <div id="addActive" style="display:none; flex-grow:1;">
            <input type="text" id="inlineInput" class="edit-input" placeholder="Название цели...">
        </div>
    </div>

    <div class="add-form-content" id="formContent">
        <div class="toggle-deadline-link" id="deadlineToggle" onclick="toggleTimeFields()">+ Добавить deadline 💀</div>

        <div id="timeSettings" style="display: none;">
            <div class="time-grid">
                <div class="time-unit"><label>Дни</label><input type="number" id="td-d" class="time-field" value="0"></div>
                <div class="time-unit"><label>Час</label><input type="number" id="td-h" class="time-field" value="0"></div>
                <div class="time-unit"><label>Мин</label><input type="number" id="td-m" class="time-field" value="0"></div>
                <div class="time-unit"><label>Сек</label><input type="number" id="td-s" class="time-field" value="0"></div>
            </div>
        </div>

        <button class="main-submit-btn" id="finalSubmit" onclick="submitNewTask(event)">Поставить цель</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const listElement = document.getElementById('taskList');
    const addZone = document.getElementById('addZone');
    const inlineInput = document.getElementById('inlineInput');
    const titleElement = document.getElementById('typewriter');
    const clockElement = document.getElementById('local-clock');

    tg.expand(); tg.ready(); tg.setHeaderColor('#0F0F0F');

    function updateClock() {
        const now = new Date(); clockElement.textContent = now.toLocaleTimeString('ru-RU');
    }
    setInterval(updateClock, 1000); updateClock();

    const greetings = {
        morning: ["Утро — лучшее время, чтобы поставить цели", "Спишь? А ТВОИ цели не спят", "Твой день — твои достижения"],
        day: ["День в разгаре, самое время добавить ЦЕЛИ", "День, ясность, время двигаться к целям"],
        evening: ["Ночь, Тишина, самое время для формулировки ЦЕЛЕЙ", "День позади, время отметить победы"]
    };

    function getGreeting() {
        const hour = new Date().getHours();
        const cat = (hour >= 5 && hour < 12) ? 'morning' : (hour >= 12 && hour < 18) ? 'day' : 'evening';
        const pool = greetings[cat];
        return pool[Math.floor(Math.random() * pool.length)];
    }

    const titleText = getGreeting();
    let charIdx = 0;
    function typeWriter() {
        if (charIdx < titleText.length) {
            titleElement.innerHTML += titleText.charAt(charIdx);
            charIdx++; setTimeout(typeWriter, 50);
        } else { titleElement.style.borderRight = "none"; }
    }

    let tasks = JSON.parse(localStorage.getItem('dg18_tasks') || '[]');

    function render() {
        listElement.innerHTML = '';
        tasks.forEach((task, index) => {
            const item = document.createElement('div');
            item.className = `task-item ${task.done ? 'completed' : ''}`;
            item.onclick = (e) => { if(e.target.closest('.action-btn')) return; toggleTask(index); };

            let deadlineHtml = '';
            if (task.deadline) deadlineHtml = `<div class="deadline-badge" id="timer-${index}">⏳...</div>`;

            item.innerHTML = `
                <div class="task-row">
                    <div class="checkbox-container ${task.done ? 'checked' : ''}"></div>
                    <span class="task-text" id="text-${index}">${task.text}</span>
                    <div class="right-action">
                        <div class="action-btn" style="color: #808080" onclick="openEditMode(event, ${index})">✎</div>
                        <div class="action-btn" style="color: #FF4A4A" onclick="deleteTask(event, ${index})">🗑</div>
                    </div>
                </div>
                ${deadlineHtml}
                <div id="edit-box-${index}" style="display:none; align-items:center; width:100%; margin-top:10px; gap:10px;">
                    <input type="text" class="edit-input" id="input-${index}" value="${task.text}">
                    <button class="main-submit-btn" style="padding: 8px 15px; font-size: 12px;" onclick="saveEdit(event, ${index})">OK</button>
                </div>
            `;
            listElement.appendChild(item);
        });
        localStorage.setItem('dg18_tasks', JSON.stringify(tasks));
        updateTimers();
    }

    function updateTimers() {
        tasks.forEach((task, index) => {
            if (!task.deadline || task.done) return;
            const timerEl = document.getElementById(`timer-${index}`);
            if (!timerEl) return;
            const distance = task.deadline - new Date().getTime();
            if (distance < 0) {
                timerEl.innerHTML = "💀 ВРЕМЯ ВЫШЛО"; timerEl.className = "deadline-badge deadline-expired";
            } else {
                const d = Math.floor(distance / 86400000);
                const h = Math.floor((distance % 86400000) / 3600000);
                const m = Math.floor((distance % 3600000) / 60000);
                const s = Math.floor((distance % 60000) / 1000);
                timerEl.innerHTML = `⏳ ${d}д ${h}ч ${m}м ${s}с`;
            }
        });
    }
    setInterval(updateTimers, 1000);

    function openAddMode() {
        document.getElementById('addStatic').style.display = 'none';
        document.getElementById('addActive').style.display = 'flex';
        document.getElementById('formContent').style.display = 'flex';
        inlineInput.focus();
    }

    function toggleTimeFields() {
        const ts = document.getElementById('timeSettings');
        const btn = document.getElementById('deadlineToggle');
        if (ts.style.display === 'none') {
            ts.style.display = 'block'; btn.innerText = "- Убрать deadline";
        } else {
            ts.style.display = 'none'; btn.innerText = "+ Добавить deadline 💀";
        }
    }

    function submitNewTask(e) {
        if(e) e.stopPropagation();
        const val = inlineInput.value.trim();
        if (!val) return;

        let deadlineTime = null;
        const d = parseInt(document.getElementById('td-d').value) || 0;
        const h = parseInt(document.getElementById('td-h').value) || 0;
        const m = parseInt(document.getElementById('td-m').value) || 0;
        const s = parseInt(document.getElementById('td-s').value) || 0;

        if (d+h+m+s > 0) deadlineTime = new Date().getTime() + (d*86400000) + (h*3600000) + (m*60000) + (s*1000);

        tasks.push({ text: val, done: false, deadline: deadlineTime });
        resetForm(); render();
        tg.HapticFeedback.impactOccurred('medium');
    }

    function resetForm() {
        inlineInput.value = '';
        document.querySelectorAll('.time-field').forEach(f => f.value = 0);
        document.getElementById('addStatic').style.display = 'block';
        document.getElementById('addActive').style.display = 'none';
        document.getElementById('formContent').style.display = 'none';
        document.getElementById('timeSettings').style.display = 'none';
    }

    // Слушатель Enter
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const activeEl = document.activeElement;
            if (activeEl.id === 'inlineInput' || activeEl.classList.contains('time-field')) {
                submitNewTask();
            }
        }
    });

    window.openEditMode = (e, index) => {
        e.stopPropagation();
        document.getElementById(`text-${index}`).style.display = 'none';
        document.getElementById(`edit-box-${index}`).style.display = 'flex';
    };

    window.saveEdit = (e, index) => {
        e.stopPropagation();
        const newVal = document.getElementById(`input-${index}`).value.trim();
        if (newVal === "") tasks.splice(index, 1);
        else tasks[index].text = newVal;
        render();
    };

    window.deleteTask = (e, index) => {
        e.stopPropagation(); tasks.splice(index, 1); render();
        tg.HapticFeedback.notificationOccurred('warning');
    };

    window.toggleTask = (index) => {
        tasks[index].done = !tasks[index].done; render();
        tg.HapticFeedback.selectionChanged();
    };

    window.onload = () => { typeWriter(); render(); };
</script>
</body>
</html>
